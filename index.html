<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Barcode Barang</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
  body { background:#f8f9fa; }
  .table td, .table th { vertical-align: middle; }

  /* ============== FULL-SCREEN SCANNER OVERLAY (ala aplikasi MDS) ============== */
  #scannerOverlay {
    display: none;
    position: fixed; inset: 0; z-index: 1050;
    background: #000;
  }
  #scannerOverlay.active { display: flex; flex-direction: column; }
  #scannerTopBar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: #111; color: #fff;
  }
  #scannerVideoWrap { position: relative; flex: 1; overflow: hidden; background: #000; }
  #scannerVideo { width: 100%; height: 100%; object-fit: cover; }
  #scanBox {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 78%; max-width: 340px; height: 160px;
    border: 3px solid #fff; border-radius: 8px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  #scannerBottomBar { background: #111; color: #ddd; padding: 12px 16px 18px; }
  #scannerBottomBar .form-select { max-width: 320px; margin: 0 auto; }
  #scannerInstruksi { font-size: 0.85rem; text-align:center; margin: 8px 0; color:#bbb; }
</style>
</head>
<body class="p-4">

<div class="card shadow-sm mx-auto" style="max-width:500px;">
  <div class="card-body">
    <h4 class="card-title text-center mb-1 text-primary">Scan Barcode Barang</h4>
    <p class="text-center text-muted small mb-4">Halaman ini terpisah dari web app Apps Script supaya kamera bisa aktif langsung.</p>

    <!-- =========================================================
         WAJIB DIISI: ganti dengan URL deployment Apps Script kamu
         Contoh: https://script.google.com/macros/s/AKfycb.../exec
         (Kalau file lama kamu sudah pernah diisi, cek/isi ulang di sini)
    ========================================================== -->
    <script>
      const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUsb_9QebJ6shl3DfwZHBY8wH8ntz6w5RGU-Gwtf-6LXff0H5dtA4dQ4qd1ASJ5fg/exec";
    </script>

    <div class="text-center mb-3">
      <button class="btn btn-outline-primary" onclick="bukaScanner()">
        📷 Scan Barcode via Kamera
      </button>
    </div>

    <div class="input-group mb-3">
      <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Atau ketik Style Barang..." autofocus>
      <button class="btn btn-primary px-4" id="btnCari" onclick="eksekusiPencarian()">Cari</button>
    </div>

    <div id="hasilPencarian" class="mt-4 table-responsive"></div>
  </div>
</div>

<!-- ============== OVERLAY SCANNER FULL-SCREEN ============== -->
<div id="scannerOverlay">
  <div id="scannerTopBar">
    <strong>Scan Barcode</strong>
    <button class="btn btn-sm btn-light" onclick="tutupScanner()">Tutup</button>
  </div>
  <div id="scannerVideoWrap">
    <video id="scannerVideo" autoplay playsinline muted></video>
    <div id="scanBox"></div>
  </div>
  <div id="scannerBottomBar">
    <div id="scannerInstruksi">Arahkan kamera ke barcode dari jarak ±10–20 cm hingga terbaca otomatis.</div>
    <select id="cameraSelect" class="form-select form-select-sm" onchange="gantiKamera(this.value)"></select>
  </div>
</div>

<script>
  // ==========================================
  // CEK KONFIGURASI
  // ==========================================
  window.addEventListener("DOMContentLoaded", function () {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_URL") > -1) {
      document.getElementById("hasilPencarian").innerHTML =
        "<div class='alert alert-warning'>⚠️ APPS_SCRIPT_URL belum diisi. Buka file ini, isi variabel APPS_SCRIPT_URL dengan URL deployment (.../exec) Apps Script kamu.</div>";
    }
  });

  // ==========================================
  // LOGIKA KAMERA SCANNER (pakai ZXing langsung + full-screen overlay)
  // ==========================================
  const codeReader = new ZXing.BrowserMultiFormatReader();
  let daftarKamera = [];
  let kameraAktifId = null;
  let sudahDapatHasil = false;

  function bukaScanner() {
    sudahDapatHasil = false;
    document.getElementById("scannerOverlay").classList.add("active");

    codeReader.listVideoInputDevices()
      .then(function (devices) {
        daftarKamera = devices.filter(function (d) { return d.kind === "videoinput"; });
        isiDropdownKamera();

        // Pilih otomatis kamera BELAKANG UTAMA, hindari Ultra Wide / Telephoto
        var pilihan = pilihKameraTerbaik(daftarKamera);
        mulaiScan(pilihan);
      })
      .catch(function () {
        // Fallback kalau enumerate gagal (izin belum diberikan) -> pakai kamera environment default
        mulaiScan(null);
      });
  }

  function pilihKameraTerbaik(devices) {
    if (!devices || devices.length === 0) return null;
    var hindari = /ultra|wide angle|lebar|tele/i;
    var belakang = /back|belakang|rear/i;

    // 1) Kamera belakang yang BUKAN ultra-wide/telephoto
    var kandidat = devices.find(function (d) {
      return belakang.test(d.label) && !hindari.test(d.label);
    });
    if (kandidat) return kandidat.deviceId;

    // 2) Kalau label tidak jelas, ambil kamera belakang apa saja
    kandidat = devices.find(function (d) { return belakang.test(d.label); });
    if (kandidat) return kandidat.deviceId;

    // 3) Fallback: device terakhir (biasanya kamera belakang di banyak HP)
    return devices[devices.length - 1].deviceId;
  }

  function isiDropdownKamera() {
    var select = document.getElementById("cameraSelect");
    select.innerHTML = "";
    daftarKamera.forEach(function (d) {
      var opt = document.createElement("option");
      opt.value = d.deviceId;
      opt.textContent = d.label || "Kamera";
      select.appendChild(opt);
    });
  }

  function gantiKamera(deviceId) {
    mulaiScan(deviceId);
  }

  function mulaiScan(deviceId) {
    kameraAktifId = deviceId;
    document.getElementById("cameraSelect").value = deviceId || "";

    codeReader.reset();
    codeReader.decodeFromVideoDevice(deviceId, "scannerVideo", function (result, err) {
      if (sudahDapatHasil) return;
      if (result) {
        sudahDapatHasil = true;
        var teks = result.getText().trim();
        document.getElementById("searchInput").value = teks;
        tutupScanner();
        eksekusiPencarian();
      }
      // err terpanggil terus tiap frame yang belum ketemu kode -> diabaikan (normal)
    });
  }

  function tutupScanner() {
    codeReader.reset();
    document.getElementById("scannerOverlay").classList.remove("active");
  }

  // Tap layar video untuk minta browser fokus ulang (best-effort, tidak semua HP mendukung)
  document.getElementById("scannerVideoWrap").addEventListener("click", function () {
    var video = document.getElementById("scannerVideo");
    var stream = video.srcObject;
    if (!stream) return;
    var track = stream.getVideoTracks()[0];
    if (track && track.getCapabilities && track.getCapabilities().focusMode) {
      track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(function () {});
    }
  });

  // ==========================================
  // LOGIKA PENCARIAN (fetch ke Apps Script)
  // ==========================================
  document.getElementById("searchInput").addEventListener("keyup", function (event) {
    if (event.key === "Enter") eksekusiPencarian();
  });

  function eksekusiPencarian() {
    var keyword = document.getElementById("searchInput").value;
    if (!keyword) {
      alert("Kolom pencarian tidak boleh kosong!");
      return;
    }
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_URL") > -1) {
      alert("APPS_SCRIPT_URL belum dikonfigurasi di file scanner.html");
      return;
    }

    document.getElementById("btnCari").disabled = true;
    document.getElementById("btnCari").innerHTML = "Mencari...";
    document.getElementById("hasilPencarian").innerHTML =
      "<div class='text-center text-muted mt-3'><i>⏳ Sedang menarik data dari server...</i></div>";

    var url = APPS_SCRIPT_URL + "?keyword=" + encodeURIComponent(keyword);

    fetch(url)
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(tampilkanHasil)
      .catch(tampilkanError);
  }

  function tampilkanHasil(response) {
    document.getElementById("btnCari").disabled = false;
    document.getElementById("btnCari").innerHTML = "Cari";

    if (response.error) {
      document.getElementById("hasilPencarian").innerHTML =
        "<div class='alert alert-danger'><b>Error Sistem:</b> " + response.error + "</div>";
      return;
    }

    var data = response.data;
    if (!data || data.length === 0) {
      document.getElementById("hasilPencarian").innerHTML =
        "<div class='alert alert-warning text-center'>Style barang tidak ditemukan.</div>";
      return;
    }

    var html = "<table class='table table-bordered table-striped text-nowrap'>";
    html += "<thead class='table-dark'><tr>" +
            "<th>Barcode</th><th>Nama Barang</th><th>Brand</th><th>Status</th>" +
            "<th>Style</th><th>Harga Jual</th><th>Size</th><th>Cup</th>" +
            "<th>Warna</th><th>Acara</th></tr></thead><tbody>";

    for (var i = 0; i < data.length; i++) {
      var hargaMentah = parseFloat((data[i][5] || "0").toString().replace(/[^0-9.-]/g, "")) || 0;
      var hargaRupiah = "Rp " + hargaMentah.toLocaleString('id-ID');

      html += "<tr>";
      html += "<td><strong>" + data[i][0] + "</strong></td>";
      html += "<td>" + data[i][1] + "</td>";
      html += "<td>" + data[i][2] + "</td>";
      html += "<td><span class='badge bg-secondary'>" + data[i][3] + "</span></td>";
      html += "<td class='text-primary fw-bold'>" + data[i][4] + "</td>";
      html += "<td class='text-end'>" + hargaRupiah + "</td>";
      html += "<td>" + data[i][6] + "</td>";
      html += "<td>" + data[i][7] + "</td>";
      html += "<td>" + data[i][8] + "</td>";
      html += "<td>" + data[i][9] + "</td>";
      html += "</tr>";
    }
    html += "</tbody></table>";

    document.getElementById("hasilPencarian").innerHTML = html;
    document.getElementById("searchInput").value = "";
    document.getElementById("searchInput").focus();
  }

  function tampilkanError(error) {
    document.getElementById("btnCari").disabled = false;
    document.getElementById("btnCari").innerHTML = "Cari";
    document.getElementById("hasilPencarian").innerHTML =
      "<div class='alert alert-danger'><b>Gagal memuat komunikasi server:</b> " + error.message +
      "<br><small>Kalau ini muncul terus, kemungkinan CORS diblokir. Coba mode JSONP (lihat catatan di bawah kode).</small></div>";
  }
</script>
</body>
</html>
